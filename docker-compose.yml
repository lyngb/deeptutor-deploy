# ============================================================
# DeepTutor (HKUDS) — Coolify 部署（单服务）
# ============================================================
# 结构刻意保持最小，与服务器上已验证可用的 vibe-trading-feishu 同构：
# 一个服务、build: .、命名卷、SERVICE_FQDN 让 Coolify 自动接反向代理。
#
# 对外只暴露 3782（Next.js 前端）。容器内的 Next 代理会把 /api/* 与 /ws/*
# 转发给同容器的后端 localhost:8001，因此不需要配 API base，
# 也不要把 8001 暴露到公网（未启用登录时 /api/partners/* 会解析成本地管理员）。
#
# 配置的写入放在镜像的 entrypoint 里（见 Dockerfile / seed/），不用 init 容器。
# 所有密钥由 Coolify 注入，仓库不含任何凭证。
# ============================================================

services:
  deeptutor:
    build:
      context: .
      dockerfile: Dockerfile
    image: deeptutor-hkuds:latest
    container_name: deeptutor
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DEEPTUTOR_WORKSPACE_ROOT=/workspace
      - DEEPTUTOR_WORKSPACE_ALLOWED_ROOTS=/workspace
      # --- 配置种子（由 seed/seed.py 读取）---
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?需在 Coolify 配置 DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPTUTOR_AUTH_ENABLED=${DEEPTUTOR_AUTH_ENABLED:-}
      - DEEPTUTOR_ADMIN_USER=${DEEPTUTOR_ADMIN_USER:-admin}
      - DEEPTUTOR_ADMIN_PASSWORD=${DEEPTUTOR_ADMIN_PASSWORD:-}
      - DEEPTUTOR_SEED_FORCE=${DEEPTUTOR_SEED_FORCE:-}
      # Coolify 专用：声明后自动分配域名并接好反向代理（服务 deeptutor → 端口 3782）
      - SERVICE_FQDN_DEEPTUTOR_3782=${SERVICE_FQDN_DEEPTUTOR_3782}
    volumes:
      # 全部状态（设置 / 登录密钥 / 伙伴 / 知识库 / 记忆）——整体持久化
      - deeptutor-data:/app/data
      - deeptutor-workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  deeptutor-data:
  deeptutor-workspace:
